<mat-sidenav-container class="dashboard-container">
  <mat-sidenav mode="side" opened class="dashboard-sidenav">

    <div class="logo-area">
      <h3>CVeator</h3>
    </div>

    <div class="nav-area">
      <mat-nav-list>

        @for (link of navLinks; track link) {
        <a mat-list-item [routerLink]="link.routerLink" [activated]="link.activated">
          <mat-icon matListItemIcon>{{ link.icon }}</mat-icon>
          <span matListItemTitle>{{ link.title }}</span>
        </a>
        }

      </mat-nav-list>

      <button (click)="logOut()" matButton="outlined">Log out</button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="dashboard-content">
    <mat-toolbar color="primary">{{currentUrl()}}</mat-toolbar>

    <div class="content-wrapper">

      <router-outlet></router-outlet>
      <!-- <div class="history-section">
        <h3>Job history</h3>
        <mat-card>
          <mat-card-content>
            <p>There is no history yet</p>
          </mat-card-content>
        </mat-card>
      </div> -->
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
